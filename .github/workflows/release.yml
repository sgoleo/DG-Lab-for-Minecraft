# Used when a release is published
# Builds the mod from the release tag and attaches the resulting jars to the release
name: release-upload

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Execute Gradle build
        run: ./gradlew build

      - name: Upload jars to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Also attach the Fabric API jar the mod was built against
          v=$(grep '^fabric_version=' gradle.properties | cut -d= -f2)
          curl -fsSL -o "fabric-api-$v.jar" "https://github.com/FabricMC/fabric/releases/download/${v//+/%2B}/fabric-api-${v//+/%2B}.jar"
          gh release upload "${{ github.event.release.tag_name }}" build/libs/*.jar "fabric-api-$v.jar" --clobber
